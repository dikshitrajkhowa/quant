<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal Desk — Strategy Backtester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="tape" aria-hidden="true">
  <div class="tape-track" id="tapeTrack"></div>
</div>

<div class="shell">

  <header class="masthead">
    <div class="masthead-left">
      <span class="mark">◆</span>
      <h1>Signal Desk</h1>
    </div>
    <div class="masthead-right">
      <span class="dot" id="statusDot"></span>
      <span id="statusText" class="status-text">idle</span>
    </div>
  </header>

  <main class="layout">

    <section class="panel controls" aria-label="Backtest controls">
      <div class="field">
        <label for="exchange">Exchange</label>
        <div class="segmented" id="exchangeToggle">
          <button type="button" class="seg-btn active" data-value="NSE">NSE</button>
          <button type="button" class="seg-btn" data-value="BSE">BSE</button>
        </div>
      </div>

      <div class="field">
        <label for="stockSelect">Stock</label>
        <select id="stockSelect"></select>
      </div>

      <div class="field">
        <label for="strategySelect">Strategy</label>
        <select id="strategySelect"></select>
        <p class="hint" id="strategyHint"></p>
      </div>

      <div class="field" id="paramFields">
        <!-- strategy params injected here -->
      </div>

      <div class="field-row">
        <div class="field">
          <label for="startDate">From</label>
          <input type="date" id="startDate" />
        </div>
        <div class="field">
          <label for="capital">Capital (₹)</label>
          <input type="number" id="capital" value="100000" step="1000" />
        </div>
      </div>

      <button class="run-btn" id="runBtn">
        <span>Run backtest</span>
      </button>

      <p class="error" id="errorMsg"></p>
    </section>

    <section class="panel results" aria-label="Results">

      <div class="results-empty" id="emptyState">
        <p>Choose a stock and strategy, then run the backtest.</p>
        <p class="sub">The decision, performance metrics, and chart will appear here.</p>
      </div>

      <div class="results-content" id="resultsContent" hidden>

        <div class="decision-row">
          <div class="decision-badge" id="decisionBadge">
            <span class="decision-glow" id="decisionGlow"></span>
            <span class="decision-label" id="decisionLabel">—</span>
          </div>
          <div class="decision-meta">
            <div class="ticker-line">
              <span id="tickerName" class="ticker-name">—</span>
              <span id="strategyName" class="strategy-name">—</span>
            </div>
            <p id="explanationText" class="explanation">—</p>
            <p id="periodText" class="period">—</p>
          </div>
        </div>

        <div class="metrics-grid" id="metricsGrid"></div>

        <div class="chart-wrap">
          <img id="chartImg" alt="Backtest chart" />
        </div>

      </div>

    </section>

  </main>

  <footer class="foot">
    Data via Yahoo Finance. Educational tool only — not investment advice.
  </footer>

</div>

<script src="/static/app.js"></script>
</body>
</html>
